<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#2196F3"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD"/>
      <stop offset="100%" style="stop-color:#BBDEFB"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bgGrad)"/>
  <!-- Cloud shape -->
  <g transform="translate(100,78)">
    <ellipse cx="0" cy="0" rx="38" ry="26" fill="url(#cloudGrad)" opacity="0.95"/>
    <ellipse cx="-24" cy="6" rx="22" ry="18" fill="url(#cloudGrad)" opacity="0.95"/>
    <ellipse cx="24" cy="6" rx="22" ry="18" fill="url(#cloudGrad)" opacity="0.95"/>
    <ellipse cx="-12" cy="-10" rx="20" ry="18" fill="url(#cloudGrad)" opacity="0.95"/>
    <ellipse cx="12" cy="-10" rx="20" ry="18" fill="url(#cloudGrad)" opacity="0.95"/>
    <rect x="-42" y="0" width="84" height="22" rx="4" fill="url(#cloudGrad)" opacity="0.95"/>
  </g>
  <!-- CS text -->
  <text x="100" y="92" text-anchor="middle" fill="#1565C0" font-family="Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-1">CS</text>
  <!-- CloudStuff text -->
  <text x="100" y="148" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1">CloudStuff</text>
  <!-- Tagline -->
  <text x="100" y="170" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">ACCESSORIES</text>
</svg>

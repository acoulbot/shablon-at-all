<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2332"/>
      <stop offset="50%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="accentShip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#64B5F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg3)"/>
  <!-- Wave pattern -->
  <g opacity="0.04">
    <path d="M0,400 Q300,350 600,400 T1200,400 V500 H0 Z" fill="white"/>
    <path d="M0,420 Q300,370 600,420 T1200,420 V500 H0 Z" fill="white"/>
  </g>
  <!-- Delivery truck icon -->
  <g transform="translate(780,130)">
    <rect x="0" y="60" width="200" height="120" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <path d="M200,100 L280,130 L280,180 L200,180 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="210" y="130" width="50" height="35" rx="4" fill="rgba(79,195,247,0.15)" stroke="rgba(79,195,247,0.3)" stroke-width="1"/>
    <!-- Wheels -->
    <circle cx="60" cy="185" r="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="60" cy="185" r="8" fill="rgba(79,195,247,0.2)"/>
    <circle cx="240" cy="185" r="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="240" cy="185" r="8" fill="rgba(79,195,247,0.2)"/>
    <!-- Package boxes -->
    <rect x="20" y="80" width="40" height="40" rx="4" fill="rgba(79,195,247,0.1)" stroke="rgba(79,195,247,0.2)" stroke-width="1"/>
    <rect x="70" y="90" width="35" height="30" rx="4" fill="rgba(79,195,247,0.08)" stroke="rgba(79,195,247,0.15)" stroke-width="1"/>
    <rect x="115" y="85" width="38" height="35" rx="4" fill="rgba(79,195,247,0.12)" stroke="rgba(79,195,247,0.2)" stroke-width="1"/>
  </g>
  <!-- Location pins -->
  <g opacity="0.1">
    <g transform="translate(950,80)">
      <path d="M10,0 C15.5,0 20,4.5 20,10 C20,18 10,28 10,28 C10,28 0,18 0,10 C0,4.5 4.5,0 10,0 Z" fill="#4FC3F7"/>
      <circle cx="10" cy="10" r="4" fill="white"/>
    </g>
    <g transform="translate(1080,120)">
      <path d="M10,0 C15.5,0 20,4.5 20,10 C20,18 10,28 10,28 C10,28 0,18 0,10 C0,4.5 4.5,0 10,0 Z" fill="#64B5F6"/>
      <circle cx="10" cy="10" r="4" fill="white"/>
    </g>
  </g>
  <!-- Route line -->
  <path d="M960,108 Q1020,95 1090,148" stroke="rgba(79,195,247,0.15)" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <!-- Text -->
  <text x="80" y="170" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="800">
    <tspan>Быстрая доставка</tspan>
    <tspan x="80" dy="58">по всей России</tspan>
  </text>
  <text x="80" y="300" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="20">
    <tspan>Надёжная упаковка и оперативная отправка</tspan>
  </text>
  <!-- Delivery badges -->
  <g transform="translate(80,340)">
    <rect x="0" y="0" width="130" height="40" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="65" y="25" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="12" font-weight="600">СДЭК</text>
    <rect x="145" y="0" width="130" height="40" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="210" y="25" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="12" font-weight="600">Почта России</text>
    <rect x="290" y="0" width="130" height="40" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="355" y="25" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="12" font-weight="600">OZON</text>
  </g>
  <!-- Brand -->
  <rect x="80" y="420" width="140" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="150" y="443" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">CLOUDSTUFF</text>
</svg>

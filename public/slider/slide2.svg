<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D"/>
      <stop offset="50%" style="stop-color:#3A3A3A"/>
      <stop offset="100%" style="stop-color:#4A7D94"/>
    </linearGradient>
    <linearGradient id="battGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A8C8D8"/>
      <stop offset="100%" style="stop-color:#7BA3B8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg2)"/>
  <!-- Dot pattern -->
  <g opacity="0.04">
    <pattern id="dots2" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="white"/>
    </pattern>
    <rect width="1200" height="500" fill="url(#dots2)"/>
  </g>
  <!-- Big powerbank illustration -->
  <g transform="translate(800,60)">
    <rect x="0" y="0" width="140" height="340" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="45" y="-12" width="50" height="14" rx="5" fill="rgba(255,255,255,0.15)"/>
    <!-- Battery bars -->
    <rect x="20" y="40" width="100" height="12" rx="4" fill="url(#battGrad)" opacity="0.8"/>
    <rect x="20" y="62" width="100" height="12" rx="4" fill="url(#battGrad)" opacity="0.6"/>
    <rect x="20" y="84" width="100" height="12" rx="4" fill="url(#battGrad)" opacity="0.4"/>
    <rect x="20" y="106" width="60" height="12" rx="4" fill="url(#battGrad)" opacity="0.25"/>
    <!-- Capacity text -->
    <text x="70" y="180" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="Arial, sans-serif" font-size="32" font-weight="700">20000</text>
    <text x="70" y="205" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="Arial, sans-serif" font-size="14">mAh</text>
    <!-- USB ports -->
    <rect x="25" y="260" width="40" height="16" rx="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="45" y="273" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="Arial, sans-serif" font-size="8">USB-C</text>
    <rect x="75" y="260" width="40" height="16" rx="3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="95" y="273" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="Arial, sans-serif" font-size="8">USB-A</text>
    <!-- QC badge -->
    <rect x="30" y="295" width="80" height="22" rx="6" fill="rgba(123,163,184,0.15)" stroke="rgba(123,163,184,0.3)" stroke-width="1"/>
    <text x="70" y="310" text-anchor="middle" fill="#7BA3B8" font-family="Arial, sans-serif" font-size="10" font-weight="600">Quick Charge</text>
  </g>
  <!-- Lightning bolt -->
  <g transform="translate(1020,160)" opacity="0.08">
    <polygon points="30,0 0,60 25,60 10,110 70,40 40,40 60,0" fill="#A8C8D8"/>
  </g>
  <!-- Text -->
  <text x="80" y="170" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="800">
    <tspan>Powerbank Walker</tspan>
  </text>
  <text x="80" y="230" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="22">
    <tspan>Заряд на ходу — от 5000 до 20000 mAh</tspan>
  </text>
  <text x="80" y="270" fill="rgba(255,255,255,0.45)" font-family="Arial, sans-serif" font-size="17">
    <tspan>Quick Charge • Power Delivery • Компактный дизайн</tspan>
  </text>
  <!-- CTA -->
  <rect x="80" y="310" width="250" height="52" rx="12" fill="url(#battGrad)"/>
  <text x="205" y="342" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Смотреть Powerbank</text>
  <!-- Brand -->
  <rect x="80" y="420" width="140" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="150" y="443" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">CLOUDSTUFF</text>
</svg>

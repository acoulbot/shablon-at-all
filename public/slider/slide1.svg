<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#1A2332"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#4FC3F7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg1)"/>
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1200" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="1200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1000" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="500" stroke="white" stroke-width="0.5"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="900" cy="120" r="80" fill="#2196F3" opacity="0.08"/>
  <circle cx="1000" cy="300" r="120" fill="#4FC3F7" opacity="0.06"/>
  <circle cx="850" cy="400" r="60" fill="#2196F3" opacity="0.1"/>
  <!-- Cable/plug icon -->
  <g transform="translate(820,180)" opacity="0.15">
    <rect x="0" y="0" width="8" height="80" rx="4" fill="white"/>
    <rect x="30" y="0" width="8" height="80" rx="4" fill="white"/>
    <rect x="-10" y="80" width="58" height="30" rx="6" fill="white"/>
    <rect x="0" y="110" width="38" height="50" rx="4" fill="white"/>
  </g>
  <!-- Phone case icon -->
  <g transform="translate(950,100)" opacity="0.12">
    <rect x="0" y="0" width="60" height="100" rx="10" fill="none" stroke="white" stroke-width="3"/>
    <rect x="5" y="5" width="50" height="90" rx="8" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="30" cy="85" r="5" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- Powerbank icon -->
  <g transform="translate(1020,250)" opacity="0.12">
    <rect x="0" y="0" width="80" height="140" rx="12" fill="none" stroke="white" stroke-width="3"/>
    <rect x="25" y="-8" width="30" height="8" rx="3" fill="white"/>
    <rect x="15" y="20" width="50" height="4" rx="2" fill="white"/>
    <rect x="15" y="30" width="50" height="4" rx="2" fill="white"/>
    <rect x="15" y="40" width="50" height="4" rx="2" fill="white"/>
    <rect x="15" y="50" width="30" height="4" rx="2" fill="#4FC3F7"/>
  </g>
  <!-- Text content -->
  <text x="80" y="180" fill="white" font-family="Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    <tspan>Аксессуары для</tspan>
    <tspan x="80" dy="60">ваших устройств</tspan>
  </text>
  <text x="80" y="290" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="20" letter-spacing="0.5">
    <tspan>Чехлы, кейсы, зарядки, кабели и powerbank</tspan>
  </text>
  <!-- CTA button -->
  <rect x="80" y="330" width="220" height="52" rx="12" fill="url(#accent1)"/>
  <text x="190" y="362" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">В каталог</text>
  <!-- Brand badge -->
  <rect x="80" y="420" width="140" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="150" y="443" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">CLOUDSTUFF</text>
</svg>
